# DropLinq infrastructure (Blueprint)
# - droplinq-web: static Expo web UI
# - droplinq-monitor: always-on Node monitor + Web Push sender
#
# Native iOS/Android builds are unchanged (EAS / Expo Go).

services:
  - type: web
    name: droplinq-web
    runtime: static
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /sw.js
        destination: /sw.js
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.webmanifest
      - type: rewrite
        source: /auth/callback
        destination: /index.html
      - type: rewrite
        source: /auth/callback/
        destination: /index.html
      - type: rewrite
        source: /pro
        destination: /index.html
      - type: rewrite
        source: /pro/
        destination: /index.html
      - type: rewrite
        source: /billing/success
        destination: /index.html
      - type: rewrite
        source: /billing/success/
        destination: /index.html
      - type: rewrite
        source: /billing/cancel
        destination: /index.html
      - type: rewrite
        source: /billing/cancel/
        destination: /index.html
      - type: rewrite
        source: /help
        destination: /index.html
      - type: rewrite
        source: /help/
        destination: /index.html
      - type: rewrite
        source: /start
        destination: /index.html
      - type: rewrite
        source: /start/
        destination: /index.html
      - type: rewrite
        source: /sign-in
        destination: /index.html
      - type: rewrite
        source: /sign-in/
        destination: /index.html
      - type: rewrite
        source: /home
        destination: /index.html
      - type: rewrite
        source: /home/
        destination: /index.html
      - type: rewrite
        source: /setup
        destination: /index.html
      - type: rewrite
        source: /setup/
        destination: /index.html
      - type: rewrite
        source: /app
        destination: /index.html
      - type: rewrite
        source: /app/
        destination: /index.html
      - type: rewrite
        source: /alerts/history
        destination: /index.html
      - type: rewrite
        source: /alerts/history/
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: droplinq-monitor
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm run monitor
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /tmp/droplinq-state.json
      - key: POLL_INTERVAL_MS
        value: "30000"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://getdroplinq.com
      - key: STRIPE_PRICE_MONTHLY
        value: price_1UFPgoRBL2iCt8U25j53wi6x
      - key: STRIPE_PRICE_ANNUAL
        value: price_1UFPgpRBL2iCt8U2cnMhBf6T
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
