# DropLinq infrastructure (Blueprint)
# - droplinq-web: static Expo web UI
# - droplinq-monitor: always-on Node monitor + Web Push sender
#
# Native iOS/Android builds are unchanged (EAS / Expo Go).

services:
  - type: web
    name: droplinq-web
    runtime: static
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /sw.js
        destination: /sw.js
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.webmanifest

  - type: web
    name: droplinq-monitor
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm run monitor
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /tmp/droplinq-state.json
      - key: POLL_INTERVAL_MS
        value: "30000"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
